<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POV Serverraum – Launch-Nacht</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: relative; margin: 0 auto; }
  canvas { display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; font-family: Inter, 'Arial Black', system-ui, sans-serif; }
  /* Ort/Zeit-Box oben links */
  .box { position: absolute; left: calc(var(--u) * 40); top: calc(var(--u) * 64); padding: calc(var(--u) * 16) calc(var(--u) * 26) calc(var(--u) * 18);
         border-radius: calc(var(--u) * 16); background: rgba(20, 24, 36, .9); border: calc(var(--u) * 2) solid rgba(255,255,255,.14);
         box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 18) rgba(0,0,0,.45); max-width: calc(var(--u) * 900); }
  .box .k { color: #a9b3c9; font-weight: 800; font-size: calc(var(--u) * 24); letter-spacing: .05em; text-transform: uppercase; margin-bottom: calc(var(--u) * 6); }
  .box .v { color: #fff; font-weight: 800; font-size: calc(var(--u) * 44); letter-spacing: -.005em; }
  .box.red { background: #d7262e; border-color: rgba(255,255,255,.35); }
  .box.red .k { color: #ffe3e3; }
  /* Untertitel */
  #sub { position: absolute; left: 6%; right: 6%; top: 61%; text-align: center; font-weight: 900; font-size: calc(var(--u) * 54); line-height: 1.15;
         -webkit-text-stroke: calc(var(--u) * 10) #121218; paint-order: stroke fill; letter-spacing: -.005em; }
  /* Abspann */
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; gap: calc(var(--u) * 40); }
  #end .big { font-weight: 900; font-size: calc(var(--u) * 66); -webkit-text-stroke: calc(var(--u) * 10) #121218; paint-order: stroke fill; }
  #end .small { font-weight: 700; font-size: calc(var(--u) * 28); color: #c9cfdd; -webkit-text-stroke: calc(var(--u) * 6) #121218; paint-order: stroke fill; position: absolute; bottom: 14%; }
  #info { position: fixed; bottom: 8px; left: 8px; color: #fff; font: 12px system-ui; opacity: .7; }
  body.render #info { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../node_modules/three/build/three.module.js",
  "three/addons/": "../../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <div id="box" class="box" style="display:none"><div class="k"></div><div class="v"></div></div>
    <div id="sub"></div>
    <div id="end" style="display:none"><div class="big"></div><div class="small"></div></div>
  </div>
</div>
<div id="info">Leertaste = Pause · ←/→ = 1 s springen · ?t=12 = Standbild</div>
<script type="module">
import * as THREE from 'three';
import { createPovPost, makePovHands, preloadHands } from '../shared/toon.js';
import { buildScene } from './scene.js';
import * as S from './script.js';

const params = new URLSearchParams(location.search);
const W = +params.get('w') || Math.round(Math.min(innerHeight * 9 / 16, innerWidth));
const H = +params.get('h') || Math.round(W * 16 / 9);
if (params.has('w')) document.body.classList.add('render');
const stage = document.getElementById('stage');
stage.style.width = W + 'px';
stage.style.height = H + 'px';
stage.style.setProperty('--u', W / 1080 + 'px');

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

await preloadHands();
const { scene, update } = buildScene();
const camera = new THREE.PerspectiveCamera(+params.get('fov') || 100, W / H, 0.03, 60);
camera.rotation.order = 'YXZ';
scene.add(camera);
const hands = await makePovHands(camera, { sleeve: '#3b3f4a', skin: '#f1c39c' });
const post = createPovPost(renderer, W, H, { fisheye: +(params.get('fisheye') ?? 0.42) });

// ---- Kamera aus Keyframes
// Hermite-Spline (Catmull-Rom mit ungleichen Zeitabständen): die Kamera gleitet durch die
// Keys, statt an jedem anzuhalten. Ein Key mit hold: true bremst dort bewusst ab.
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const v = (a) => new THREE.Vector3(...a);
function spline(t, field) {
  const K = S.CAM;
  if (t <= K[0].t) return v(K[0][field]);
  if (t >= K[K.length - 1].t) return v(K[K.length - 1][field]);
  let i = 0;
  while (t >= K[i + 1].t) i++;
  const a = K[i], b = K[i + 1], dt = b.t - a.t;
  const tan = (j) => {
    const k = K[j];
    if (k.hold || j === 0 || j === K.length - 1) return new THREE.Vector3();
    return v(K[j + 1][field]).sub(v(K[j - 1][field])).divideScalar(K[j + 1].t - K[j - 1].t);
  };
  const u = (t - a.t) / dt, u2 = u * u, u3 = u2 * u;
  const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
  return v(a[field]).multiplyScalar(h00).add(tan(i).multiplyScalar(h10 * dt))
    .add(v(b[field]).multiplyScalar(h01)).add(tan(i + 1).multiplyScalar(h11 * dt));
}
const walking = (t) => S.WALK.reduce((m, [a, b]) => Math.max(m, ease((t - a) / 0.4) * (1 - ease((t - b + 0.5) / 0.5))), 0);
// Natürliches „Kopf-Wackeln“: mehrere langsame, sich überlagernde Schwingungen
const sway = (t, s) => Math.sin(t * 0.61 + s) * 0.6 + Math.sin(t * 1.37 + s * 2.1) * 0.3 + Math.sin(t * 2.9 + s * 3.7) * 0.1;
function placeCamera(t) {
  const pos = spline(t, 'pos');
  // Blick: Spline-Ziel, dann leicht nachgezogen (der Kopf folgt mit Verzögerung)
  const look = spline(t - 0.08, 'look').lerp(spline(t, 'look'), 0.5);
  const bob = walking(t);
  const phase = t * Math.PI * 2 * 1.7;
  pos.y += (Math.abs(Math.sin(phase)) - 0.5) * 0.04 * bob;
  pos.x += Math.sin(phase / 2) * 0.02 * bob;
  look.x += sway(t, 0) * 0.04;
  look.y += sway(t, 1.3) * 0.03 + Math.sin(phase) * 0.02 * bob;
  camera.position.copy(pos);
  camera.lookAt(look);
  camera.rotateZ(Math.sin(phase / 2) * 0.01 * bob + sway(t, 2.6) * 0.008);
  hands.update(t, { bob, phase, raiseL: ease((t - S.CHEER) / 0.3) * (1 - ease((t - 19.3) / 0.5)) });
}

// ---- Overlays
const boxEl = document.getElementById('box');
const subEl = document.getElementById('sub');
const endEl = document.getElementById('end');
function overlays(t) {
  const b = S.BOXES.find((x) => t >= x.t0 && t < x.t1);
  if (b) {
    boxEl.style.display = '';
    boxEl.className = 'box ' + (b.variant === 'red' ? 'red' : '');
    boxEl.querySelector('.k').textContent = b.kicker;
    boxEl.querySelector('.v').textContent = b.text;
    const a = ease((t - b.t0) / 0.25);
    const first = S.BOXES[0] === b;
    boxEl.style.opacity = first ? a : 1;
    boxEl.style.transform = `translateY(${(1 - (first ? a : 1)) * -12}px) scale(${b.variant === 'red' ? 1 + 0.04 * Math.max(0, 1 - (t - b.t0) * 4) : 1})`;
  } else boxEl.style.display = 'none';

  const l = S.LINES.find((x) => t >= x.t0 && t < x.t1);
  if (l) {
    subEl.textContent = l.text;
    subEl.style.color = S.SPEAKERS[l.who] || '#fff';
    const a = ease((t - l.t0) / 0.12);
    subEl.style.opacity = a;
    subEl.style.transform = `scale(${0.92 + 0.08 * a})`;
  } else subEl.textContent = '';

  const e = S.ENDCARD;
  const fade = ease((t - e.t0) / 0.6);
  post.uniforms.fade.value = fade * 0.72;
  if (t >= e.t0) {
    endEl.style.display = '';
    endEl.style.opacity = ease((t - e.t0 - 0.3) / 0.4);
    endEl.querySelector('.big').textContent = e.lines.join('\n');
    endEl.querySelector('.small').textContent = e.small;
  } else endEl.style.display = 'none';
}

function renderAt(t) {
  placeCamera(t);
  update(t, camera.position);
  overlays(t);
  post.render(scene, camera, t);
}

// ---- Wiedergabe im Browser / Einzelbild für das Render-Skript
let t = +(params.get('t') ?? 0);
let playing = !params.has('t') && !params.has('w');
let last = performance.now();
function loop(now) {
  if (playing) { t += (now - last) / 1000; if (t > S.DURATION) t = 0; }
  last = now;
  renderAt(t);
  requestAnimationFrame(loop);
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') playing = !playing;
  if (e.code === 'ArrowRight') t = Math.min(S.DURATION, t + 1);
  if (e.code === 'ArrowLeft') t = Math.max(0, t - 1);
});
if (params.has('w')) renderAt(t); else requestAnimationFrame(loop);

window.__pov = { renderAt, duration: S.DURATION, sfx: S.SFX };
window.__ready = true;
</script>
</body>
</html>
