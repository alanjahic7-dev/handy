<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Café am Ocean Drive – 3D-Set</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
  #hud button { background: rgba(20,20,30,.72); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #hud button.active { background: #ff3fa4; border-color: #ff3fa4; }
  #label { position: fixed; bottom: 12px; left: 12px; color: #fff; text-shadow: 0 1px 3px #000; font-size: 14px; }
  body.clean #hud, body.clean #label { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../node_modules/three/build/three.module.js",
  "three/addons/": "../../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<div id="label"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { buildScene, CAMERAS as CAM_PORTRAIT, CAMERAS_WIDE } from './scene.js';

const params = new URLSearchParams(location.search);
const clean = params.get('hud') === '0';
if (clean) document.body.classList.add('clean');
const W = +params.get('w') || innerWidth;
const H = +params.get('h') || innerHeight;
// Hochformat (9:16) nutzt die Vice-Files-Kameras, Querformat die breiten Presets
const CAMERAS = W / H < 1 ? CAM_PORTRAIT : CAMERAS_WIDE;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(params.get('w') ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const { scene, update, actors } = buildScene({ placeholders: params.get('placeholders') !== '0' });
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.04;
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---- Pixel-Look: niedrige Renderauflösung, scharf hochskaliert,
// dezente Konturen und leicht reduzierte Farbpalette.
//   ?pixel=0       -> aus
//   ?lowres=270    -> vertikale Pixelauflösung (kleiner = gröber)
//   ?levels=28     -> Farbstufen pro Kanal (kleiner = stärker posterisiert)
let pixelOn = params.get('pixel') !== '0';
const lowRes = +params.get('lowres') || 300;
const composer = new EffectComposer(renderer);
const pixelPass = new RenderPixelatedPass(1, scene, camera, { normalEdgeStrength: 0.15, depthEdgeStrength: 0.25 });
composer.addPass(pixelPass);
// Leuchten der LEDs / Neons (?bloom=0 aus)
const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 4, H / 4), +(params.get('bloom') ?? 0.9), 0.5, 1.0);
if (params.get('bloom') !== '0') composer.addPass(bloomPass);
composer.addPass(new OutputPass());
const paletteShader = {
  uniforms: { tDiffuse: { value: null }, levels: { value: +params.get('levels') || 24 }, saturation: { value: 1.15 }, vignette: { value: +(params.get('vignette') ?? 0.55) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float levels; uniform float saturation; uniform float vignette; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float l = dot(c.rgb, vec3(0.299,0.587,0.114));
      c.rgb = mix(vec3(l), c.rgb, saturation);
      c.rgb = floor(c.rgb * levels + 0.5) / levels;
      vec2 d = (vUv - 0.5) * vec2(1.0, 1.25);
      c.rgb *= mix(1.0, smoothstep(0.85, 0.2, length(d)), vignette);
      gl_FragColor = c;
    }`,
};
const palettePass = new ShaderPass(paletteShader);
composer.addPass(palettePass);
function resizePixel(w, h) {
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  pixelPass.setPixelSize(Math.max(1, Math.round((h * renderer.getPixelRatio()) / lowRes)));
}
resizePixel(W, H);

function setCamera(name) {
  const c = CAMERAS[name];
  if (!c) return;
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  camera.fov = c.fov;
  camera.updateProjectionMatrix();
  controls.update();
  document.getElementById('label').textContent = c.label;
  document.querySelectorAll('#hud button').forEach((b) => b.classList.toggle('active', b.dataset.cam === name));
}

const hud = document.getElementById('hud');
for (const [name, c] of Object.entries(CAMERAS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.title = c.label;
  b.dataset.cam = name;
  b.onclick = () => setCamera(name);
  hud.appendChild(b);
}
const toggle = document.createElement('button');
toggle.textContent = 'Figuren ein/aus';
toggle.onclick = () => (actors.visible = !actors.visible);
hud.appendChild(toggle);
const pix = document.createElement('button');
pix.textContent = 'Pixel-Look ein/aus';
pix.onclick = () => (pixelOn = !pixelOn);
hud.appendChild(pix);
const exp = document.createElement('button');
exp.textContent = 'GLB exportieren';
exp.onclick = async () => {
  const buf = await exportGLB();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
  a.download = 'cafe_ocean_drive.glb';
  a.click();
};
hud.appendChild(exp);

async function exportGLB() {
  return new GLTFExporter().parseAsync(scene, { binary: true, onlyVisible: true, maxTextureSize: 1024 });
}

setCamera(params.get('cam') || 'establishing');

addEventListener('resize', () => {
  if (params.get('w')) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  resizePixel(innerWidth, innerHeight);
});

// Für Offline-Rendering: feste Zeit pro Frame statt Echtzeit
const fixed = params.has('t');
let t = +(params.get('t') || 0);
const clock = new THREE.Clock();
function frame() {
  if (!fixed) t += clock.getDelta();
  update(t);
  controls.update();
  if (pixelOn) composer.render();
  else renderer.render(scene, camera);
}
renderer.setAnimationLoop(fixed ? null : frame);
if (fixed) frame();

window.__set = {
  setCamera,
  renderAt(time, camName) { t = time; if (camName) setCamera(camName); frame(); },
  exportGLB: async () => { const b = await exportGLB(); return Array.from(new Uint8Array(b)); },
  showPlaceholders: (v) => { actors.visible = v; },
  camera, controls, scene,
};
window.__ready = true;
</script>
</body>
</html>
